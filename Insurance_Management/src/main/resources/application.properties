spring.application.name=insurance-management
server.port=8081

eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/Claim_Management_demo?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=2003@manish
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true



# SLF4J/Logback: application and framework logs are written to one rolling log file.
logging.file.name=logs/insurance-management.log
logging.logback.rollingpolicy.file-name-pattern=logs/insurance-management-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB
logging.level.root=INFO
logging.level.com.app.insurance_management=INFO
logging.level.org.springframework.cloud.openfeign=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=msurve519@gmail.com
spring.mail.password=veaz ozhd mmdi rakk

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Enable multipart file upload
spring.servlet.multipart.enabled=true

# Maximum file size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

claim.survey.motor-threshold=100000
claim.survey.report-dir=uploads/survey-reports


# Change these ports to your actual service ports
policy.service.url=${POLICY_SERVICE_URL:http://localhost:8082}
premium.service.url=${PREMIUM_SERVICE_URL:http://localhost:8083}

# LOCAL TESTING ONLY
claim.external-services.mock-enabled=true