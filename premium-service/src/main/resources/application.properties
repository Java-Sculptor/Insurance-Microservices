spring.application.name=premium-service
server.port=8087
spring.datasource.url=jdbc:mysql://localhost:3306/premium_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Logic@851
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Policy Service Inter-Service Endpoint for OpenFeign
policy.service.url=http://localhost:8088

premium.penalty-per-day=10
premium.max-penalty-amount=5000
premium.scheduler.overdue.cron=0 0 0 * * ?
premium.scheduler.reminder.cron=0 0 8 * * ?

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# OpenFeign Client Configuration
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

