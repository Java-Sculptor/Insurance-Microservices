<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark"><i class="bi bi-shield-check"></i></div>
    <h1>InsureSphere</h1>
    <p>Role preview</p>
    <label for="login-role">Role</label>
    <select id="login-role" (change)="onRoleChange($event)" [value]="selectedRole()">
      @for (role of roles; track role) { <option [value]="role">{{roleLabels[role]}}</option> }
    </select>
    <button type="button" (click)="continue()">Open dashboard <i class="bi bi-arrow-right"></i></button>
    <small>Authentication will be integrated by the authorization team.</small>
  </div>
</div>
